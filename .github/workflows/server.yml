name: Remote SSH Tunnel

on:
  workflow_dispatch:
    inputs:
      enable_macos:
        description: '开启 macOS 节点'
        type: boolean
        default: true
      enable_windows:
        description: '开启 Windows 节点'
        type: boolean
        default: true
      enable_linux:
        description: '开启 Linux 节点'
        type: boolean
        default: true

jobs:
  # ==========================================
  # 1. macOS SSH 调试节点 (User-space SSHD 强启版)
  # ==========================================
  ssh-macos:
    name: SSH (macOS)
    if: inputs.enable_macos
    runs-on: macos-latest
    steps:
      - name: Configure SSH Key & Start Userspace SSHD
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ 错误：未配置 SSH_PUBLIC_KEY！"
            exit 1
          fi

          # 1. 配置 authorized_keys 并设置严格权限
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

          # 2. 生成 SSH 服务端主机密钥 (Host Keys)
          mkdir -p ~/.ssh_host_keys
          ssh-keygen -t rsa -f ~/.ssh_host_keys/ssh_host_rsa_key -N ""
          ssh-keygen -t ed25519 -f ~/.ssh_host_keys/ssh_host_ed25519_key -N ""

          # 3. 创建独立的 sshd 配置文件 (监听 2222 端口，避开 macOS 系统权限限制)
          cat << 'EOF' > ~/.ssh/sshd_config_custom
          Port 2222
          HostKey /Users/runner/.ssh_host_keys/ssh_host_rsa_key
          HostKey /Users/runner/.ssh_host_keys/ssh_host_ed25519_key
          AuthorizedKeysFile /Users/runner/.ssh/authorized_keys
          PubkeyAuthentication yes
          StrictModes no
          PasswordAuthentication no
          PidFile /Users/runner/.ssh/sshd.pid
          EOF

          # 4. 显式启动用户态 sshd
          /usr/sbin/sshd -f /Users/runner/.ssh/sshd_config_custom
          sleep 2

          # 5. 验证 2222 端口是否成功监听
          if netstat -an | grep '\.2222 '; then
            echo "✅ macOS SSHD 服务已在 2222 端口启动成功！"
          else
            echo "❌ SSHD 启动失败！"
            exit 1
          fi

      - name: Start ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "❌ 错误：未配置 NGROK_AUTHTOKEN！"
            exit 1
          fi
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken "$NGROK_TOKEN"
          # 穿透用户态 SSHD 监听的 2222 端口
          ngrok tcp 2222 --log=stdout > ngrok.log &
          sleep 5
          echo "================ macOS SSH ADDRESS ================"
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///'
          echo "User: runner | Auth: SSH Private Key"
          echo "==================================================="

      - name: Keep Alive
        run: while true; do sleep 30; done

  # ==========================================
  # 2. Linux (Ubuntu) SSH 调试节点
  # ==========================================
  ssh-linux:
    name: SSH (Linux)
    if: inputs.enable_linux
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key & Start SSHD
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ 错误：未配置 SSH_PUBLIC_KEY！"
            exit 1
          fi

          # 1. 写入公钥并修正属主与权限
          mkdir -p /home/runner/.ssh
          echo "$SSH_KEY" > /home/runner/.ssh/authorized_keys
          chmod 700 /home/runner/.ssh
          chmod 600 /home/runner/.ssh/authorized_keys
          chown -R runner:runner /home/runner/.ssh

          # 2. 修正 sshd 配置，放行公钥认证与关闭严格模式
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#StrictModes yes/StrictModes no/' /etc/ssh/sshd_config
          echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          echo "AuthorizedKeysFile .ssh/authorized_keys" | sudo tee -a /etc/ssh/sshd_config

          # 3. 重启 SSH 服务
          sudo systemctl restart ssh

      - name: Start ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "❌ 错误：未配置 NGROK_AUTHTOKEN！"
            exit 1
          fi
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          ngrok config add-authtoken "$NGROK_TOKEN"
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "================ Linux SSH ADDRESS ================"
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///'
          echo "User: runner | Auth: SSH Private Key"
          echo "==================================================="

      - name: Keep Alive
        run: while true; do sleep 30; done

  # ==========================================
  # 3. Windows SSH 调试节点
  # ==========================================
  ssh-windows:
    name: SSH (Windows)
    if: inputs.enable_windows
    runs-on: windows-latest
    steps:
      - name: Configure SSH Key & Start SSHD
        shell: powershell
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:SSH_KEY)) {
            Write-Error "ERROR: SSH_PUBLIC_KEY is missing"
            exit 1
          }
          # Windows OpenSSH 管理员 authorized_keys 默认存储路径
          $Path = "C:\ProgramData\ssh\administrators_authorized_keys"
          New-Item -ItemType File -Path $Path -Force
          Add-Content -Path $Path -Value $env:SSH_KEY

          # 修复文件 ACL 权限，确保 Windows SSHD 认可该文件
          icacls.exe $Path /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"

          # 启动 sshd 服务并开启防火墙 22 端口
          Set-Service -Name sshd -StartupType 'Automatic'
          Start-Service sshd
          New-NetFirewallRule -Name sshd -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -ErrorAction SilentlyContinue

      - name: Start ngrok
        shell: powershell
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:NGROK_TOKEN)) {
            Write-Error "ERROR: NGROK_AUTHTOKEN is missing"
            exit 1
          }
          choco install ngrok --no-progress -y
          & ngrok config add-authtoken "$env:NGROK_TOKEN"
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 22 --log=stdout" -NoNewWindow
          Start-Sleep -Seconds 5
          $Response = Invoke-RestMethod -Uri 'http://localhost:4040/api/tunnels'
          $Url = $Response.tunnels[0].public_url -replace 'tcp://', ''

          Write-Output "=== Windows SSH ADDRESS ==="
          Write-Output "SSH URL: $Url"
          Write-Output "User: runneradmin | Auth: SSH Private Key"
          Write-Output "=========================="

      - name: Keep Alive
        shell: powershell
        run: while ($true) { Start-Sleep -Seconds 30 }
