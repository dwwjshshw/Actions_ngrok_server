name: Multi-Platform Build & Remote Debug Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动触发

jobs:
  # =========================================================
  # Job 1: 跨平台自动化编译矩阵 (macOS, Windows, Linux)
  # =========================================================
  build-matrix:
    name: Build (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 单个平台失败不影响其他平台打包
      matrix:
        include:
          - os: macos-latest
            target-platform: macos-ios-android
          - os: windows-latest
            target-platform: windows
          - os: ubuntu-latest
            target-platform: linux

    steps:
      - name: Checkout Facetory
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Checkout ClaralightDesign-Flutter
        uses: actions/checkout@v4
        with:
          repository: AstralSightStudios/ClaralightDesign-Flutter
          token: ${{ secrets.GH_PAT }}
          path: ClaralightDesign-Flutter

      # ---------------- Setup Tools ----------------
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,aarch64-apple-ios' || '' }}

      # Linux 系统依赖补全
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # ---------------- Fix Apple AppIcon ----------------
      - name: Fix AppIcon Directory Conflict (macOS Only)
        if: runner.os == 'macOS'
        run: |
          if [ -d "ios/AppIcon.icon" ]; then
            mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
            cp -Rf ios/AppIcon.icon/* ios/Runner/Assets.xcassets/AppIcon.appiconset/
            rm -rf ios/AppIcon.icon
          fi
          if [ -d "macos/AppIcon.icon" ]; then
            mkdir -p macos/Runner/Assets.xcassets/AppIcon.appiconset
            cp -Rf macos/AppIcon.icon/* macos/Runner/Assets.xcassets/AppIcon.appiconset/
            rm -rf macos/AppIcon.icon
          fi

      # ---------------- Install Dependencies ----------------
      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods (macOS Only)
        if: runner.os == 'macOS'
        run: |
          cd macos && pod install --no-repo-update && cd ..
          cd ios && pod install --no-repo-update && cd ..

      # ---------------- Build Artifacts ----------------
      # 1. macOS 节点：构建 macOS, iOS, Android
      - name: Build macOS / iOS / Android
        if: runner.os == 'macOS'
        run: |
          flutter build apk --debug
          flutter build macos --release
          flutter build ios --release --no-codesign

      # 2. Windows 节点：构建 Windows EXE
      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          flutter build windows --release

      # 3. Linux 节点：构建 Linux Bundle
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release

      # ---------------- Upload Artifacts ----------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Facetory-Build-${{ matrix.target-platform }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/macos/Build/Products/Release/*.app
            build/ios/iphoneos/*.app
            build/windows/runner/Release/*
            build/linux/x64/release/bundle/*

  # =========================================================
  # Job 2: 保持 macOS 远程 SSH 调试通道 (针对 macOS 节点)
  # =========================================================
  remote-ssh-debug:
    name: macOS Remote SSH Tunnel (ngrok)
    runs-on: macos-latest
    # 允许与编译任务并行运行，或仅在需要远程调试时开启
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure macOS SSH & Set Password
        run: |
          RUNNER_PASS="Password1234@"
          sudo dscl . -passwd /Users/runner "$RUNNER_PASS" "$RUNNER_PASS" 2>/dev/null || \
          sudo dscl . -create /Users/runner passwd "$RUNNER_PASS"
          
          sudo systemsetup -setremotelogin on
          sudo sed -i '' 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i '' 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist

      - name: Setup ngrok Tunnel
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "======================================================="
          echo "🌐 SSH 连接地址如下："
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///'
          echo "🔑 Password: Password1234@"
          echo "======================================================="

      - name: Keep Tunnel Alive
        run: |
          echo "🚀 隧道已建立，开始保活..."
          while true; do sleep 30; done
