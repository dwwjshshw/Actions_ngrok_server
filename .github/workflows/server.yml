name: Multi-Platform Remote SSH Tunnel

on:
  workflow_dispatch:
    inputs:
      enable_macos:
        description: '开启 macOS 节点'
        type: boolean
        default: true
      enable_windows:
        description: '开启 Windows 节点'
        type: boolean
        default: true
      enable_linux:
        description: '开启 Linux 节点'
        type: boolean
        default: true

jobs:
  # ==========================================
  # 1. macOS SSH 调试节点
  # ==========================================
  ssh-macos:
    name: SSH (macOS)
    if: inputs.enable_macos
    runs-on: macos-latest
    steps:
      - name: Configure SSH & Password
        run: |
          RUNNER_PASS="Password1234@"
          sudo dscl . -passwd /Users/runner "$RUNNER_PASS" "$RUNNER_PASS" 2>/dev/null || \
          sudo dscl . -create /Users/runner passwd "$RUNNER_PASS"
          sudo systemsetup -setremotelogin on
          sudo sed -i '' 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i '' 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist

      - name: Start ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok/ngrok/ngrok
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "================ macOS SSH ADDRESS ================"
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///'
          echo "User: runner | Password: Password1234@"
          echo "==================================================="

      - name: Keep Alive
        run: while true; do sleep 30; done

  # ==========================================
  # 2. Windows SSH 调试节点
  # ==========================================
  ssh-windows:
    name: SSH (Windows)
    if: inputs.enable_windows
    runs-on: windows-latest
    steps:
      - name: Configure SSH & Password
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Password1234@" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          
          # 安装并启动 OpenSSH Server
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'

      - name: Start ngrok
        shell: powershell
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          choco install ngrok --no-progress
          ngrok config add-authtoken $env:NGROK_TOKEN
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 22 --log=stdout" -NoNewWindow
          Start-Sleep -Seconds 5
          $Response = Invoke-RestMethod -Uri 'http://localhost:4040/api/tunnels'
          $Url = $Response.tunnels[0].public_url -replace 'tcp://', ''
          Write-Host "================ Windows SSH ADDRESS ================"
          Write-Host "SSH URL: $Url"
          Write-Host "User: runneradmin | Password: Password1234@"
          Write-Host "====================================================="

      - name: Keep Alive
        shell: powershell
        run: while ($true) { Start-Sleep -Seconds 30 }

  # ==========================================
  # 3. Linux (Ubuntu) SSH 调试节点
  # ==========================================
  ssh-linux:
    name: SSH (Linux)
    if: inputs.enable_linux
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH & Password
        run: |
          echo "runner:Password1234@" | sudo chpasswd
          sudo systemctl start ssh

      - name: Start ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5
          echo "================ Linux SSH ADDRESS ================"
          curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///'
          echo "User: runner | Password: Password1234@"
          echo "==================================================="

      - name: Keep Alive
        run: while true; do sleep 30; done
